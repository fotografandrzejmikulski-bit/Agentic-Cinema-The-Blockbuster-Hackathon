<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudioSync</title><style>body{font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#eef2ff;margin:0}main{max-width:1100px;margin:auto;padding:40px}textarea,button{font:inherit}textarea{width:100%;height:120px;background:#111936;color:#fff;border:1px solid #34406b;border-radius:14px;padding:14px}button{margin-top:12px;background:#fff;color:#10162d;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}.card{background:#111936;border:1px solid #29355e;border-radius:16px;padding:18px}.muted{color:#aab4d5}.bar{height:10px;background:#283457;border-radius:10px;overflow:hidden}.fill{height:100%;background:#7dd3fc}</style></head><body><main><h1>StudioSync</h1><p class="muted">Agentic production recovery cockpit — scenario impact, location recovery and budget risk in one auditable workflow.</p><textarea id="q">A storm cancels Scene 42. Find the best recovery option within 48 hours and quantify the budget delta.</textarea><button onclick="run()">Run recovery analysis</button><section id="out"></section></main><script>async function run(){const q=document.getElementById('q').value;const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({instruction:q})});const x=await r.json();document.getElementById('out').innerHTML=`<div class='grid'><div class='card'><b>Budget delta</b><h2>+$${x.budget.delta.toLocaleString()} ${x.budget.currency}</h2><span class='muted'>Confidence: ${x.budget.confidence}</span></div><div class='card'><b>Approval gate</b><h2>${x.approvals.status}</h2><span class='muted'>${x.approvals.actions.length} controlled actions</span></div></div><div class='card' style='margin-top:14px'><b>Ranked locations</b>${x.studio_options.map(s=>`<p>${s.name} — ${s.available_window} — $${s.estimated_cost.toLocaleString()} — ${(s.fit_score*100).toFixed(0)}% fit<div class='bar'><div class='fill' style='width:${s.fit_score*100}%'></div></div></p>`).join('')}</div><div class='card' style='margin-top:14px'><b>Audit trail</b>${x.provenance.map(p=>`<p class='muted'>• ${p}</p>`).join('')}</div>`}</script></body></html>
